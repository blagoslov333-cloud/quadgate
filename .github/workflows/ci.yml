name: QuadGate CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install QuadGate with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install mypy
        run: pip install mypy

      - name: Run static type checks
        run: mypy --follow-imports=silent quadgate benchmarks

      - name: Run pytest suite
        run: pytest -v

      - name: Run QuadGate doctor check
        run: python -m quadgate.cli doctor

      - name: Run A/B benchmark dry-replay
        run: python -m quadgate.cli bench --dry-replay
