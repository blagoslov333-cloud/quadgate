name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          PDF_ASSETS=(benchmarks/reports/quadgate_*_executive_summary.pdf)
          gh release create "${GITHUB_REF_NAME}" dist/* "${PDF_ASSETS[@]}" \
            --verify-tag \
            --title "QuadGate ${GITHUB_REF_NAME}" \
            --generate-notes
